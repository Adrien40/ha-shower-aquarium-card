name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esbuild:
    name: Bundle builds cleanly (esbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Catches a bundling regression (e.g. a stray import esbuild can't
      # resolve) that would otherwise leave dist/ silently never rebuilt.
      - name: Run build
        run: npm run build

      # Loads the built dist/ bundle the way Home Assistant does.
      - name: Smoke-test the built bundle
        run: npm run test:dist

      # Handy to try a PR's card in a private Home Assistant.
      - name: Keep the built bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/shower-aquarium-card.js
          retention-days: 7
