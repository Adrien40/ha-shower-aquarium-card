name: Build dist/

# dist/shower-aquarium-card.js is a generated bundle (esbuild) and is
# gitignored as a local dev convenience, but it still needs to exist *in
# the repo* on main, because HACS (and manual installers) serve it
# straight from there rather than from a build step of their own. This
# workflow is what keeps it in sync automatically: every push to main
# that touches the real source rebuilds dist/ and commits the result
# back, so a maintainer can never forget to rebuild before merging.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "translations/**"
      - "build.mjs"
      - "package.json"

permissions:
  contents: write

# Avoid two runs racing to push dist/ if commits land close together.
concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Guard against an infinite loop: skip the run that this workflow's own
    # commit would otherwise trigger.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Commit dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist/ unchanged, nothing to commit."
          else
            git commit -m "chore: rebuild dist/ [skip ci]"
            git push
          fi
